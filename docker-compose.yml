version: '3'

services:
    haproxy:
        image: haproxy:latest
        volumes:
            - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg
            - ./certs/dockerproject.gq.pem:/etc/ssl/certs/dockerproject.gq.pem:ro
            - ./certs/dockerproject.gq.pem.ocsp:/etc/ssl/certs/dockerproject.gq.pem.ocsp:ro
            - ./dhparm.pem:/etc/ssl/certs/dhparm.pem
        ports:
            - "80:80"
            - "443:443"
        depends_on:
            - web
        networks:
            - code-network
    web:
        image: nginx:latest
        ports:
            - "8080:8080"
            - "8443:8443"
        volumes:
            - ./code:/code
            - ./site.conf:/etc/nginx/conf.d/default.conf
            - ./certs/privkey.pem:/etc/ssl/certs/privkey.pem:ro
            - ./certs/fullchain.pem:/etc/ssl/certs/fullchain.pem:ro
        depends_on:
            - php
        networks:
            - code-network
    php:
        image: php:fpm
        volumes:
            - ./code:/code
            - ./www.conf:/usr/local/etc/php-fpm.d/www.conf
        networks:
            - code-network
    mysql:
        image: mysql:latest
        ports:
            - "127.0.0.1:3306:3306"
        environment:
            - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    redis:
        image: redis:alpine
        command: ["sh", "-c", 'exec redis-server --requirepass "$$REDIS_PASSWORD"']
        ports:
            - "127.0.0.1:6379:6379"
        environment:
            - REDIS_PASSWORD=${REDIS_PASSWORD:?Set REDIS_PASSWORD}
networks:
    code-network:
        driver: bridge
